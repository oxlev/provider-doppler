    doppler_service_account:
        subCategory: Service Accounts
        description: Manage a Doppler service account.
        name: doppler_service_account
        title: doppler_service_account Resource - terraform-provider-doppler
        examples:
            - name: ci
              manifest: |-
                {
                  "name": "ci",
                  "workplace_role": "collaborator"
                }
        argumentDocs:
            id: (String) The ID of this resource.
            name: (String) The name of the service account
            slug: (String) The slug of the service account
            workplace_permissions: (List of String) A list of the workplace permissions for the service account (or use workplace_role)
            workplace_role: (String) The identifier of the workplace role for the service account (or use workplace_permissions)
        importStatements:
            - |-
              # import using the service account slug from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/service_accounts/[service-account-slug]
              terraform import doppler_service_account.default <service-account-slug>
    doppler_service_account_identity:
        subCategory: Service Accounts
        description: Manage a Doppler service account identity.
        name: doppler_service_account_identity
        title: doppler_service_account_identity Resource - terraform-provider-doppler
        examples:
            - name: github_oidc
              manifest: |-
                {
                  "config_oidc": [
                    {
                      "claims": [
                        {
                          "key": "aud",
                          "values": [
                            "https://github.com/DopplerHQ"
                          ]
                        },
                        {
                          "key": "sub",
                          "values": [
                            "repo:DopplerHQ/terraform-provider-doppler:pull_request",
                            "repo:DopplerHQ/terraform-provider-doppler:ref:refs/heads/feature*"
                          ]
                        }
                      ],
                      "claims_type": "wildcard",
                      "discovery_url": "https://token.actions.githubusercontent.com"
                    }
                  ],
                  "name": "GitHub Actions OIDC",
                  "service_account_slug": "${doppler_service_account.ci.slug}",
                  "ttl_seconds": 600
                }
              references:
                service_account_slug: doppler_service_account.ci.slug
              dependencies:
                doppler_service_account.ci: |-
                    {
                      "name": "ci",
                      "workplace_role": "collaborator"
                    }
        argumentDocs:
            claims: '(Block Set, Min: 2) A set of valid values for a specific claim. At least "aud" and "sub" must be provided (see below for nested schema)'
            claims_type: (String) If "wildcard", wildcard characters will be expanded during claims validation. Defaults to "exact"
            config_oidc: '(Block List, Min: 1, Max: 1) The OIDC configuration for the identity (see below for nested schema)'
            discovery_url: (String) The public URL of the OpenID discovery service
            id: (String) The ID of this resource.
            key: (String) The key of the claim to validate
            name: (String) The display name of the service account identity
            service_account_slug: (String) Slug of the service account
            slug: (String) Slug of the service account identity
            ttl_seconds: (Number) The amount of time, in seconds, that auth tokens for this identity will be valid
            values: (Set of String) The set of valid values for this claim
        importStatements:
            - terraform import doppler_service_account_identity.default <service-account-slug>.<service-account-identity-slug>
    doppler_service_account_token:
        subCategory: Service Accounts
        description: Manage a Doppler service account token.
        name: doppler_service_account_token
        title: doppler_service_account_token Resource - terraform-provider-doppler
        examples:
            - name: builder_ci_token
              manifest: |-
                {
                  "expires_at": "2024-05-30T11:00:00.000Z",
                  "name": "Builder CI Token",
                  "service_account_slug": "${doppler_service_account.ci.slug}"
                }
              references:
                service_account_slug: doppler_service_account.ci.slug
              dependencies:
                doppler_service_account.ci: |-
                    {
                      "name": "ci",
                      "workplace_role": "collaborator"
                    }
        argumentDocs:
            api_key: (String, Sensitive) The api key used to authenticate the service account
            created_at: (String) The datetime that the token was created.
            expires_at: (String) The datetime at which the API token should expire. If not provided, the API token will remain valid indefinitely unless manually revoked
            id: (String) The ID of this resource.
            name: (String) The display name of the API token
            service_account_slug: (String) Slug of the service account
            slug: (String) Slug of the service account token
        importStatements: []
    doppler_service_token:
        subCategory: Service Tokens
