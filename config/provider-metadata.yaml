        examples:
            - name: backend_ci_token
              manifest: |-
                {
                  "access": "read",
                  "config": "ci",
                  "name": "Builder Token",
                  "project": "backend"
                }
        argumentDocs:
            access: (String) The access level (read or read/write)
            config: (String) The name of the Doppler config where the service token is located
            id: (String) The ID of this resource.
            key: (String, Sensitive) The key for the Doppler service token
            name: (String) The name of the Doppler service token
            project: (String) The name of the Doppler project where the service token is located
        importStatements: []
    doppler_trusted_ips:
        subCategory: Configs
        description: Manage the trusted IP allowlist for a Doppler config.
        name: doppler_trusted_ips
        title: doppler_trusted_ips Resource - terraform-provider-doppler
        examples:
            - name: backend_prd
              manifest: |-
                {
                  "config": "prd",
                  "project": "backend",
                  "trusted_ips": [
                    "203.0.113.0/24",
                    "198.51.100.5/32",
                    "2001:db8::1/128"
                  ]
                }
            - name: backend_stg
              manifest: |-
                {
                  "config": "stg",
                  "project": "backend",
                  "trusted_ips": [
                    "203.0.113.0/24"
                  ]
                }
            - name: backend_dev
              manifest: |-
                {
                  "config": "dev",
                  "project": "backend",
                  "trusted_ips": [
                    "0.0.0.0/0"
                  ]
                }
        argumentDocs:
            /32: for an exact IPv4 address and /128 for an exact IPv6 address (e.g. 1.2.3.4/32 or 2001:db8::1/128).
            '["0.0.0.0/0"]': (allow all traffic). Deleting this resource restores that default.
            config: (String) The name of the Doppler config
            id: (String) The ID of this resource.
            project: (String) The name of the Doppler project where the config is located
            trusted_ips: (Set of String) List of trusted IP ranges in CIDR notation (e.g. 203.0.113.0/24, 1.2.3.4/32). Use 0.0.0.0/0 to allow all traffic.
        importStatements:
            - terraform import doppler_trusted_ips.backend_prd backend.prd
    doppler_webhook:
        subCategory: Webhooks
        description: Manage a Doppler Webhook.
        name: doppler_webhook
        title: doppler_webhook Resource - terraform-provider-doppler
        examples:
            - name: ci
              manifest: |-
                {
                  "authentication": [
                    {
                      "token": "my bearer token",
                      "type": "Bearer"
                    }
                  ],
                  "enabled": true,
                  "enabled_configs": [
                    "${doppler_config.ci_github.name}"
                  ],
                  "name": "My Webhook",
                  "payload": "${jsonencode({\n    myKey = \"my value\"\n  })}",
                  "project": "${doppler_project.test_proj.name}",
                  "secret": "my signing secret-2",
                  "url": "https://localhost/webhook"
                }
              references:
                enabled_configs: doppler_config.ci_github.name
                project: doppler_project.test_proj.name
        argumentDocs:
            authentication: '(Block List, Max: 1) Authentication method used by the webhook (see below for nested schema)'
            enabled: (Boolean) Whether the webhook is enabled or disabled.  Default to true.
            enabled_configs: (Set of String) Configs this webhook will trigger for
            id: (String) The ID of this resource.
