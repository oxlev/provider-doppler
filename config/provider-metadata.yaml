    doppler_secrets_sync_aws_parameter_store:
        subCategory: Integrations
        description: Manage an AWS Parameter Store Doppler sync.
        name: doppler_secrets_sync_aws_parameter_store
        title: doppler_secrets_sync_aws_parameter_store Resource - terraform-provider-doppler
        examples:
            - name: backend_prod
              manifest: |-
                {
                  "config": "prd",
                  "delete_behavior": "leave_in_target",
                  "integration": "${doppler_integration_aws_parameter_store.prod.id}",
                  "path": "/backend/",
                  "project": "backend",
                  "region": "us-east-1",
                  "secure_string": true,
                  "tags": {
                    "myTag": "enabled"
                  }
                }
              references:
                integration: doppler_integration_aws_parameter_store.prod.id
              dependencies:
                aws_iam_role.doppler_parameter_store: |-
                    {
                      "assume_role_policy": "${jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Effect = \"Allow\"\n        Action = \"sts:AssumeRole\"\n        Principal = {\n          AWS = \"arn:aws:iam::299900769157:user/doppler-integration-operator\"\n        },\n        Condition = {\n          StringEquals = {\n            \"sts:ExternalId\" = \"\u003cYOUR_WORKPLACE_SLUG\u003e\"\n          }\n        }\n      },\n    ]\n  })}",
                      "inline_policy": [
                        {
                          "name": "doppler_secret_manager",
                          "policy": "${jsonencode({\n      Version = \"2012-10-17\"\n      Statement = [\n        {\n          Action = [\n\n            \"ssm:PutParameter\",\n            \"ssm:LabelParameterVersion\",\n            \"ssm:DeleteParameter\",\n            \"ssm:RemoveTagsFromResource\",\n            \"ssm:GetParameterHistory\",\n            \"ssm:AddTagsToResource\",\n            \"ssm:GetParametersByPath\",\n            \"ssm:GetParameters\",\n            \"ssm:GetParameter\",\n            \"ssm:DeleteParameters\"\n          ]\n          Effect   = \"Allow\"\n          Resource = \"*\"\n          # Limit Doppler to only access certain names\n        },\n      ]\n    })}"
                        }
                      ],
                      "name": "doppler_parameter_store"
                    }
                doppler_integration_aws_parameter_store.prod: |-
                    {
                      "assume_role_arn": "${aws_iam_role.doppler_parameter_store.arn}",
                      "name": "Production"
                    }
        argumentDocs:
            advanced_parameter: (Boolean) Whether or not the parameters are explicitly stored as an advanced parameter
            config: (String) The name of the Doppler config
            delete_behavior: (String) The behavior to be performed on the secrets in the sync target when this resource is deleted or recreated. Either leave_in_target (default) or delete_from_target.
            id: (String) The ID of this resource.
            integration: (String) The slug of the integration to use for this sync
            kms_key_id: (String) The AWS KMS key used to encrypt the parameter (ID, Alias, or ARN)
            name_transform: '(String) An optional secret name transformer (e.g. DOPPLER_CONFIG in lower-kebab would be doppler-config). Valid transformers: none, camel, upper-camel, lower-snake, tf-var, dotnet, dotnet-env, lower-kebab'
            path: (String) The path to the parameters in AWS
            project: (String) The name of the Doppler project
            region: (String) The AWS region
            secure_string: (Boolean) Whether or not the parameters are stored as a secure string
            sync_strategy: (String) Determines whether secrets are synced to a single secret (single-secret) as a JSON object or multiple discrete secrets (multi-secret). Defaults to multi-secret if unspecified.
            tags: (Map of String) AWS tags to attach to the parameters
            update_resource_tags: (String) Behavior for AWS resource tags on updates (never update, upsert tags (leaving non-Doppler tags alone), replace tags (remove non-Doppler tags))
        importStatements: []
    doppler_secrets_sync_aws_secrets_manager:
        subCategory: Integrations
        description: Manage an AWS Secrets Manager Doppler sync.
        name: doppler_secrets_sync_aws_secrets_manager
        title: doppler_secrets_sync_aws_secrets_manager Resource - terraform-provider-doppler
        examples:
            - name: backend_prod
              manifest: |-
                {
                  "config": "prd",
                  "delete_behavior": "leave_in_target",
                  "integration": "${doppler_integration_aws_secrets_manager.prod.id}",
                  "path": "/backend/",
                  "project": "backend",
                  "region": "us-east-1",
                  "tags": {
                    "myTag": "enabled"
                  }
                }
              references:
                integration: doppler_integration_aws_secrets_manager.prod.id
              dependencies:
                aws_iam_role.doppler_secrets_manager: |-
                    {
                      "assume_role_policy": "${jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Effect = \"Allow\"\n        Action = \"sts:AssumeRole\"\n        Principal = {\n          AWS = \"arn:aws:iam::299900769157:user/doppler-integration-operator\"\n        },\n        Condition = {\n          StringEquals = {\n            \"sts:ExternalId\" = \"\u003cYOUR_WORKPLACE_SLUG\u003e\"\n          }\n        }\n      },\n    ]\n  })}",
                      "inline_policy": [
                        {
                          "name": "doppler_secret_manager",
                          "policy": "${jsonencode({\n      Version = \"2012-10-17\"\n      Statement = [\n        {\n          Action = [\n\n            \"secretsmanager:GetSecretValue\",\n            \"secretsmanager:DescribeSecret\",\n            \"secretsmanager:PutSecretValue\",\n            \"secretsmanager:CreateSecret\",\n            \"secretsmanager:DeleteSecret\",\n            \"secretsmanager:TagResource\",\n            \"secretsmanager:UpdateSecret\"\n          ]\n          Effect   = \"Allow\"\n          Resource = \"*\"\n          # Limit Doppler to only access certain secret names\n        },\n      ]\n    })}"
                        }
                      ],
                      "name": "doppler_secrets_manager"
                    }
                doppler_integration_aws_secrets_manager.prod: |-
                    {
                      "assume_role_arn": "${aws_iam_role.doppler_secrets_manager.arn}",
                      "name": "Production"
                    }
        argumentDocs:
            config: (String) The name of the Doppler config
            delete_behavior: (String) The behavior to be performed on the secrets in the sync target when this resource is deleted or recreated. Either leave_in_target (default) or delete_from_target.
            id: (String) The ID of this resource.
            integration: (String) The slug of the integration to use for this sync
            kms_key_id: (String) The AWS KMS key used to encrypt the secret (ID, Alias, or ARN)
            name_transform: '(String) An optional secret name transformer (e.g. DOPPLER_CONFIG in lower-kebab would be doppler-config). Valid transformers: none, camel, upper-camel, lower-snake, tf-var, dotnet, dotnet-env, lower-kebab'
            path: (String) The path to the secret in AWS
            path_behavior: (String) The behavior to modify the provided path. Either add_doppler_suffix (default) which appends doppler to the provided path or none which leaves the path unchanged.
            project: (String) The name of the Doppler project
            region: (String) The AWS region
            sync_strategy: (String) Determines whether secrets are synced to a single secret (single-secret) as a JSON object or multiple discrete secrets (multi-secret). Defaults to single-secret if unspecified.
            tags: (Map of String) AWS tags to attach to the secrets
            update_metadata: (Boolean) If enabled, Doppler will update the AWS secret metadata (e.g. KMS key) during every sync. If disabled, Doppler will only set secret metadata for new AWS secrets.
            update_resource_tags: (String) Behavior for AWS resource tags on updates (never update, upsert tags (leaving non-Doppler tags alone), replace tags (remove non-Doppler tags))
        importStatements: []
    doppler_secrets_sync_azure_vault:
        subCategory: Integrations
        description: Manage an Azure Vault Doppler sync.
        name: doppler_secrets_sync_azure_vault
        title: doppler_secrets_sync_azure_vault Resource - terraform-provider-doppler
        examples:
            - name: backend_prod
              manifest: |-
                {
                  "config": "prd",
                  "delete_behavior": "delete_from_target",
                  "integration": "${doppler_integration_azure_vault_service_principal.prod.id}",
                  "project": "backend",
                  "single_secret_name": "DopplerSecrets",
                  "sync_strategy": "single-secret",
