    doppler_integration_gcp_secret_manager_oidc:
        subCategory: Integrations
        description: Manage a GCP Secret Manager Doppler integration using workload identity federation.
        name: doppler_integration_gcp_secret_manager_oidc
        title: doppler_integration_gcp_secret_manager_oidc Resource - terraform-provider-doppler
        examples:
            - name: prod
              manifest: |-
                {
                  "gcp_project_id": "your-gcp-project-id",
                  "gcp_secret_prefix": "doppler-",
                  "gcp_workload_identity_provider": "//iam.googleapis.com/${google_iam_workload_identity_pool_provider.doppler.name}",
                  "name": "Production"
                }
              dependencies:
                google_iam_workload_identity_pool.doppler: |-
                    {
                      "workload_identity_pool_id": "doppler-pool"
                    }
                google_iam_workload_identity_pool_provider.doppler: |-
                    {
                      "attribute_condition": "assertion.workplace == '\u003cYOUR_WORKPLACE_SLUG\u003e'",
                      "attribute_mapping": {
                        "google.subject": "assertion.sub"
                      },
                      "oidc": [
                        {
                          "issuer_uri": "https://api.doppler.com"
                        }
                      ],
                      "workload_identity_pool_id": "${google_iam_workload_identity_pool.doppler.workload_identity_pool_id}",
                      "workload_identity_pool_provider_id": "doppler"
                    }
                google_project_iam_member.doppler: |-
                    {
                      "condition": [
                        {
                          "expression": "resource.name.startsWith(\"projects/\u003cYOUR_PROJECT_NUMBER\u003e/secrets/doppler-\")",
                          "title": "doppler-prefix-only"
                        }
                      ],
                      "member": "${doppler_integration_gcp_secret_manager_oidc.prod.federation_principal}",
                      "project": "your-gcp-project-id",
                      "role": "roles/secretmanager.admin"
                    }
        argumentDocs:
            federation_principal: (String) The IAM principal identifier to grant roles to in GCP for this integration
            gcp_project_id: (String) The ID of the GCP project the integration operates on
            gcp_secret_prefix: (String) The prefix added to any secret created by this integration in GCP. Cannot be changed after the integration is created.
            gcp_workload_identity_provider: (String) The full resource name of the workload identity pool provider Doppler federates with, e.g. //iam.googleapis.com/projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider. Note that it uses the numeric project number, not the project ID.
            id: (String) The ID of this resource.
            name: (String) The name of the integration
        importStatements: []
    doppler_integration_gcp_service_account_keys:
        subCategory: Integrations
        description: Manage a GCP Service Account Keys Doppler integration.
        name: doppler_integration_gcp_service_account_keys
        title: doppler_integration_gcp_service_account_keys Resource - terraform-provider-doppler
        examples:
            - name: i_gcp_sak
              manifest: |-
                {
                  "external_id": "${doppler_integration_external_id.i_gcp_sak_extid.id}",
                  "impersonated_service_account": "${google_service_account.gcpsa_doppler_impersonate.email}",
                  "name": "TF GCP Service Account Keys"
                }
              references:
                external_id: doppler_integration_external_id.i_gcp_sak_extid.id
                impersonated_service_account: google_service_account.gcpsa_doppler_impersonate.email
              dependencies:
                doppler_integration_external_id.i_gcp_sak_extid: |-
                    {
                      "integration_type": "gcp_service_account_keys"
                    }
                doppler_rotated_secret_gcp_service_account_keys.rs_gcpsak: |-
                    {
                      "config": "dev",
                      "integration": "${doppler_integration_gcp_service_account_keys.i_gcp_sak.id}",
                      "name": "GCP_SERVICE_ACCOUNT",
                      "project": "backend",
                      "rotation_period_sec": 2592000,
                      "service_account": "${google_service_account.gcpsa_rotated.email}"
                    }
                google_service_account.gcpsa_doppler_impersonate: |-
                    {
                      "account_id": "xxxxxxxxxxx",
                      "description": "${format(\"doppler_impersonate:%s\", doppler_integration_external_id.i_gcp_sak_extid.id)}",
                      "display_name": "xxxxxxxxxx"
                    }
                google_service_account.gcpsa_rotated: |-
                    {
                      "account_id": "xxxxxxxxxxxxxxxxxx",
                      "display_name": "xxxxxxxxxxxxxxxxxx"
                    }
                google_service_account_iam_policy.gcp_policy_impersonate: |-
                    {
                      "policy_data": "${data.google_iam_policy.doppler_rotation_impersonate_policy.policy_data}",
                      "service_account_id": "${google_service_account.gcpsa_doppler_impersonate.name}"
                    }
                google_service_account_iam_policy.gcp_policy_rotated: |-
                    {
                      "policy_data": "${data.google_iam_policy.doppler_rotated_user_policy.policy_data}",
                      "service_account_id": "${google_service_account.gcpsa_rotated.name}"
                    }
        argumentDocs:
            external_id: (String) The Doppler-generated external id (placed in the service account description field)
            id: (String) The ID of this resource.
            impersonated_service_account: (String) The service account email of the account to be impersonated
            name: (String) The name of the integration
        importStatements: []
