name: dopplerhq/doppler
resources:
    doppler_change_request_policy:
        subCategory: Change Requests
        description: Manage a Doppler change request policy.
        name: doppler_change_request_policy
        title: doppler_change_request_policy Resource - terraform-provider-doppler
        examples:
            - name: prd_review
              manifest: |-
                {
                  "description": "A change request policy which requires 2 total approvals, and 1 approval from emily or any member of the prod_reviewers group.\nReviews from the author of the change request are not counted.\nThis policy is enforced in all configs of the prd environment of test_proj, as well as the ci_github branch config.\n",
                  "name": "Prod Review",
                  "rules": [
                    {
                      "auto_assign_reviewers": "matchCount",
                      "disallow_self_review": true,
                      "required_reviewers": [
                        {
                          "count": 2
                        },
                        {
                          "count": 1,
                          "group_slugs": [
                            "${doppler_group.prod_reviewers.slug}"
                          ],
                          "user_slugs": [
                            "${data.doppler_user.emily.slug}"
                          ]
                        }
                      ]
                    }
                  ],
                  "targets": [
                    {
                      "project": [
                        {
                          "config_names": [
                            "${doppler_config.ci_github.name}"
                          ],
                          "environment_slugs": [
                            "${doppler_environment.prd.slug}"
                          ],
                          "project_name": "${doppler_project.test_proj.name}"
                        }
                      ]
                    }
                  ]
                }
              references:
                rules.required_reviewers.group_slugs: doppler_group.prod_reviewers.slug
                rules.required_reviewers.user_slugs: data.doppler_user.emily.slug
                targets.project.config_names: doppler_config.ci_github.name
                targets.project.environment_slugs: doppler_environment.prd.slug
                targets.project.project_name: doppler_project.test_proj.name
              dependencies:
                doppler_config.ci_github: |-
                    {
                      "environment": "${doppler_environment.ci.slug}",
                      "name": "ci_github",
                      "project": "${doppler_project.test_proj.name}"
                    }
                doppler_environment.ci: |-
                    {
                      "name": "CI-CD",
                      "project": "${doppler_project.test_proj.name}",
                      "slug": "ci"
                    }
                doppler_environment.prd: |-
                    {
                      "name": "prd",
                      "project": "${doppler_project.test_proj.name}",
                      "slug": "prd"
                    }
                doppler_group.prod_reviewers: |-
                    {
                      "name": "Prod Reviewers"
                    }
                doppler_group_member.prod_reviewers: |-
                    {
                      "for_each": "${toset([data.doppler_user.nic.slug])}",
                      "group_slug": "${doppler_group.prod_reviewers.slug}",
                      "user_slug": "${each.value}"
                    }
                doppler_project.test_proj: |-
                    {
                      "description": "This is a test project",
                      "name": "my-test-project"
                    }
        argumentDocs:
            all: (Boolean) Whether or not the policy applies to all configs in the project
            all_projects: (Boolean) Whether or not the policy applies to all projects in the workplace
            auto_assign_reviewers: '(String) If set, the strategy used to automatically assign reviewers to CRs targeted by this policy. Valid values: all, matchCount, never (default)'
            config_names: (Set of String) Specific configs the policy applies to
            count: (Number) The number of approvals a change request must receive before it can be applied
            description: (String) A description of the change request policy
            disallow_self_review: (Boolean) If true, approvals from the author of a change request will be excluded when evaluating this policy
            environment_slugs: (Set of String) Entire environments the policy applies to
            group_slugs: (Set of String) If set, only approvals from members of these groups will satisfy this rule
            id: (String) The ID of this resource.
            name: (String) The name of the change request policy
            project: (Block Set) A project that the policy will apply to (see below for nested schema)
            project_name: (String) The name of the project to apply the policy to
            required_reviewers: (Block Set) Enforces that a specific number of users approve a change request before it can be applied (see below for nested schema)
            rules: '(Block List, Min: 1, Max: 1) Rules that the policy will apply to its targets (see below for nested schema)'
            slug: (String) The unique identifier of the change request policy
            targets: '(Block List, Min: 1, Max: 1) Where the policy will apply (see below for nested schema)'
            user_slugs: (Set of String) If set, only approvals from these users will satisfy this rule
        importStatements:
            - terraform import doppler_change_request_policy.<name> <change-request-policy-id>
    doppler_config:
        subCategory: Project Structure
        description: Manage a Doppler config.
        name: doppler_config
        title: doppler_config Resource - terraform-provider-doppler
        examples:
            - name: backend_ci_github
              manifest: |-
                {
                  "environment": "ci",
                  "name": "ci_github",
                  "project": "backend"
                }
        argumentDocs:
            descriptor: (String) The descriptor (project.config) of the Doppler config
            environment: (String) The name of the Doppler environment where the config is located
            id: (String) The ID of this resource.
            inheritable: (Boolean) Whether or not the Doppler config can be inherited by other configs
            inherits: (List of String) A list of other Doppler config descriptors that this config inherits from. Descriptors match the format "project.config" (e.g. backend.stg), which is most easily retrieved as the computed descriptor of a doppler_config resource (e.g. doppler_config.backend_stg.descriptor)
            name: (String) The name of the Doppler config
            project: (String) The name of the Doppler project where the config is located
        importStatements:
            - terraform import doppler_config.default <project-name>.<environment-slug>.<config-name>
    doppler_environment:
        subCategory: Project Structure
        description: Manage a Doppler environment.
        name: doppler_environment
        title: doppler_environment Resource - terraform-provider-doppler
        examples:
            - name: backend_ci
              manifest: |-
                {
                  "name": "Continuous Integration",
                  "project": "backend",
                  "slug": "ci"
                }
        argumentDocs:
            id: (String) The ID of this resource.
            name: (String) The name of the Doppler environment
            personal_configs: (Boolean) Whether or not personal configs are enabled for the environment
            project: (String) The name of the Doppler project where the environment is located
            slug: (String) The slug of the Doppler environment
        importStatements:
            - terraform import doppler_environment.default <project-name>.<environment-slug>
    doppler_group:
        subCategory: Groups
        description: Manage a Doppler group.
        name: doppler_group
        title: doppler_group Resource - terraform-provider-doppler
        examples:
            - name: engineering
              manifest: |-
                {
                  "name": "engineering",
                  "workplace_role": "viewer"
                }
        argumentDocs:
            default_project_role: (String) The default project role assigned to the group when added to a Doppler project. If set to null, the default project role is inherited from the workplace setting.
            id: (String) The ID of this resource.
            name: (String) The name of the group
            slug: (String) The slug of the group
            workplace_role: (String) The workplace role assigned to members of the group. If omitted, state will be tracked in Terraform but not updated in Doppler. Use "no_access" to ensure the group has no workplace permissions
        importStatements:
            - |-
              # import using the group slug from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/groups/[group-slug]
              terraform import doppler_group.default <group-slug>
    doppler_group_member:
        subCategory: Groups
        description: Manage a Doppler user/group membership.
        name: doppler_group_member
        title: doppler_group_member Resource - terraform-provider-doppler
        examples:
            - name: engineering
              manifest: |-
                {
                  "for_each": "${toset([data.doppler_user.nic.slug, data.doppler_user.andre.slug])}",
                  "group_slug": "${doppler_group.engineering.slug}",
                  "user_slug": "${each.value}"
                }
              references:
                group_slug: doppler_group.engineering.slug
                user_slug: each.value
              dependencies:
                doppler_group.engineering: |-
                    {
                      "name": "engineering"
                    }
        argumentDocs:
            group_slug: (String) The slug of the Doppler group
            id: (String) The ID of this resource.
            user_slug: (String) The slug of the Doppler workplace user
        importStatements:
            - |-
              # import using the group slug from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/groups/[group-slug]
              # and the user slug from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/users/[user-slug]
              terraform import doppler_group_member.default <group-slug>.workplace_user.<user-slug>
    doppler_group_members:
        subCategory: Groups
        description: Manage a Doppler group's memberships.
        name: doppler_group_members
        title: doppler_group_members Resource - terraform-provider-doppler
        examples:
            - name: engineering
              manifest: |-
                {
                  "group_slug": "${doppler_group.engineering.slug}",
                  "user_slugs": [
                    "${data.doppler_user.nic.slug}",
                    "${data.doppler_user.andre.slug}"
                  ]
                }
              references:
                group_slug: doppler_group.engineering.slug
                user_slugs: data.doppler_user.nic.slug
              dependencies:
                doppler_group.engineering: |-
                    {
                      "name": "engineering"
                    }
        argumentDocs:
            group_slug: (String) The slug of the group
            id: (String) The ID of this resource.
            user_slugs: (Set of String) A list of user slugs in the group
        importStatements:
            - |-
              # import using the group slug from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/groups/[group-slug]
              # and the user slugs from the URL:
              # https://dashboard.doppler.com/workplace/[workplace-slug]/team/users/[user-slug]
              terraform import doppler_group_members.default <group-slug>
